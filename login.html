<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Login | GlobalMedia AI Developer Coach</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #080d18;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 440px;
    background: #111a2b;
    padding: 30px 23px;
    border-radius: 14px;
    border: 1px solid #26344a;
}

.logo {
    text-align: center;
    font-size: 23px;
    font-weight: bold;
    margin-bottom: 8px;
}

.logo span {
    color: #3b9cff;
}

.subtitle {
    text-align: center;
    color: #aab6ca;
    font-size: 13px;
    margin-bottom: 30px;
}

h2 {
    margin-bottom: 8px;
    font-size: 24px;
}

.description {
    color: #aab6ca;
    font-size: 13px;
    margin-bottom: 23px;
    line-height: 1.6;
}

input {
    width: 100%;
    padding: 14px;
    margin-bottom: 15px;
    border: 1px solid #34445e;
    background: #080d18;
    color: white;
    border-radius: 7px;
    outline: none;
    font-size: 14px;
}

input:focus {
    border-color: #3b9cff;
}

.password-wrapper {
    position: relative;
}

.password-wrapper input {
    padding-right: 65px;
}

.toggle-password {
    position: absolute;
    right: 13px;
    top: 14px;
    color: #3b9cff;
    font-size: 12px;
    cursor: pointer;
}

.forgot {
    text-align: right;
    margin-top: -5px;
    margin-bottom: 20px;
    font-size: 13px;
}

.forgot a {
    color: #3b9cff;
    text-decoration: none;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 7px;
    background: #3b9cff;
    color: #06101d;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

#message {
    font-size: 13px;
    margin-top: 17px;
    text-align: center;
    line-height: 1.6;
}

.register-link {
    text-align: center;
    margin-top: 23px;
    font-size: 13px;
    color: #aab6ca;
}

.register-link a {
    color: #3b9cff;
    text-decoration: none;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        GlobalMedia <span>AI</span>
    </div>

    <p class="subtitle">DEVELOPER COACH</p>

    <h2>Welcome back!</h2>

    <p class="description">
        Sign in to continue your web development learning journey.
    </p>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Email address"
            required
        >

        <div class="password-wrapper">

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <span
                class="toggle-password"
                id="togglePassword"
            >
                Show
            </span>

        </div>

        <div class="forgot">
            <a href="forgot-password.html">Forgot password?</a>
        </div>

        <button type="submit" id="loginButton">
            Sign In
        </button>

    </form>

    <div id="message"></div>

    <p class="register-link">
        Don't have an account?
        <a href="register.html">Create account</a>
    </p>

</div>

<script>

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginButton");

const passwordInput = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");

// Show and hide password

togglePassword.addEventListener("click", function() {

    if (passwordInput.type === "password") {

        passwordInput.type = "text";
        togglePassword.textContent = "Hide";

    } else {

        passwordInput.type = "password";
        togglePassword.textContent = "Show";

    }

});


// Check existing login session

async function checkSession() {

    try {

        const { data, error } = await supabaseClient.auth.getSession();

        if (error) throw error;

        if (data.session) {

            window.location.replace("dashboard.html");

        }

    } catch (error) {

        console.error("Session check failed:", error.message);

    }

}

checkSession();


// Student login

form.addEventListener("submit", async function(e) {

    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = passwordInput.value;

    button.disabled = true;
    button.textContent = "Signing in...";

    message.style.color = "#aab6ca";
    message.textContent = "Verifying your account...";

    try {

        const { data, error } = await supabaseClient.auth.signInWithPassword({

            email: email,
            password: password

        });

        if (error) throw error;

        if (!data.session) {
            throw new Error("Login successful, but no active session was created.");
        }

        message.style.color = "#48d597";
        message.textContent = "Login successful! Redirecting...";

        window.location.replace("dashboard.html");

    } catch (error) {

        message.style.color = "#ff7777";

        message.textContent = error.message || "Unable to sign in.";

        button.disabled = false;
        button.textContent = "Sign In";

    }

});

</script>

</body>
  </html>

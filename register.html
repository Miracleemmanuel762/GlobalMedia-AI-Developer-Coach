<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Registration | GlobalMedia AI Developer Coach</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #080d18;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 440px;
    background: #111a2b;
    padding: 30px 23px;
    border-radius: 14px;
    border: 1px solid #26344a;
}

.logo {
    text-align: center;
    font-size: 23px;
    font-weight: bold;
    margin-bottom: 8px;
}

.logo span {
    color: #3b9cff;
}

.subtitle {
    text-align: center;
    color: #aab6ca;
    font-size: 13px;
    margin-bottom: 27px;
}

h2 {
    margin-bottom: 8px;
    font-size: 24px;
}

.description {
    color: #aab6ca;
    font-size: 13px;
    margin-bottom: 22px;
}

input {
    width: 100%;
    padding: 14px;
    margin-bottom: 13px;
    border: 1px solid #34445e;
    background: #080d18;
    color: white;
    border-radius: 7px;
    outline: none;
    font-size: 14px;
}

input:focus {
    border-color: #3b9cff;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 7px;
    background: #3b9cff;
    color: #06101d;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

#message {
    font-size: 13px;
    margin-top: 17px;
    text-align: center;
    line-height: 1.6;
}

.login-link {
    text-align: center;
    margin-top: 22px;
    font-size: 13px;
    color: #aab6ca;
}

.login-link a {
    color: #3b9cff;
    text-decoration: none;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        GlobalMedia <span>AI</span>
    </div>

    <p class="subtitle">DEVELOPER COACH</p>

    <h2>Create your account</h2>

    <p class="description">
        Begin your journey towards becoming a skilled web developer.
    </p>

    <form id="registerForm">

        <input
            type="text"
            id="firstName"
            placeholder="First name"
            required
        >

        <input
            type="text"
            id="lastName"
            placeholder="Last name"
            required
        >

        <input
            type="text"
            id="username"
            placeholder="Choose a username"
            required
            minlength="3"
            maxlength="20"
        >

        <input
            type="email"
            id="email"
            placeholder="Email address"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Create password"
            required
            minlength="8"
        >

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
            required
            minlength="8"
        >

        <button type="submit" id="registerButton">
            Create Account
        </button>

    </form>

    <div id="message"></div>

    <p class="login-link">
        Already have an account?
        <a href="login.html">Sign in</a>
    </p>

</div>

<script>

const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const button = document.getElementById("registerButton");

form.addEventListener("submit", async function(e) {

    e.preventDefault();

    const firstName = document.getElementById("firstName").value.trim();
    const lastName = document.getElementById("lastName").value.trim();
    const username = document.getElementById("username").value.trim().toLowerCase();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    message.style.color = "#ff7777";

    if (password !== confirmPassword) {
        message.textContent = "Your passwords do not match.";
        return;
    }

    if (!/^[a-z0-9_]{3,20}$/.test(username)) {
        message.textContent = "Username must contain 3–20 letters, numbers or underscores.";
        return;
    }

    button.disabled = true;
    button.textContent = "Creating account...";

    message.style.color = "#aab6ca";
    message.textContent = "Please wait while we create your account.";

    try {

        const { data, error } = await supabaseClient.auth.signUp({

            email: email,
            password: password,

            options: {
                data: {
                    first_name: firstName,
                    last_name: lastName,
                    username: username
                },

                emailRedirectTo: window.location.origin + "/login.html"
            }

        });

        if (error) throw error;

        if (data.session) {

            message.style.color = "#48d597";
            message.textContent =
                "Your account has been created successfully! You can now sign in.";

        } else {

            message.style.color = "#48d597";
            message.textContent =
                "Registration successful! Please check your email and verify your account before signing in.";

        }

        form.reset();

    } catch (error) {

        message.style.color = "#ff7777";

        if (error.code === "23505") {
            message.textContent = "This username is already taken. Please choose another.";
        } else {
            message.textContent = error.message || "Registration failed. Please try again.";
        }

    } finally {

        button.disabled = false;
        button.textContent = "Create Account";

    }

});

</script>

</body>
  </html>
